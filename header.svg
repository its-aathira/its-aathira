<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .hero-bg { fill: #0d1117; }
      .grid-line-h { stroke: rgba(126,105,255,0.12); stroke-width: 0.5; }
      .grid-line-v { stroke: rgba(126,105,255,0.12); stroke-width: 0.5; }

      .glow1 {
        fill: radial-gradient(circle, rgba(126,105,255,0.22) 0%, transparent 70%);
        animation: pulse1 4s ease-in-out infinite;
      }
      .glow2 {
        animation: pulse2 4s ease-in-out infinite;
      }

      @keyframes pulse1 {
        0%,100% { opacity: 0.6; }
        50%      { opacity: 1.0; }
      }
      @keyframes pulse2 {
        0%,100% { opacity: 0.5; }
        50%      { opacity: 0.9; }
      }

      .tag-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #7e69ff;
        letter-spacing: 2px;
        animation: fadein 0.8s ease both;
      }
      .name-text {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 28px;
        font-weight: 500;
        fill: #f0f0f6;
      }
      .name-accent { fill: #7e69ff; }
      .sub-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 12px;
        fill: #9896c8;
      }

      @keyframes fadein {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      /* Cursor blink */
      .cursor {
        fill: #7e69ff;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%      { opacity: 0; }
      }

      /* Petal fall */
      .p1 { animation: fall1 5s linear infinite; }
      .p2 { animation: fall2 6s linear 1s infinite; }
      .p3 { animation: fall3 4.5s linear 2s infinite; }
      .p4 { animation: fall4 5.5s linear 0.5s infinite; }
      .p5 { animation: fall5 7s linear 1.5s infinite; }

      @keyframes fall1 { 0%{transform:translate(0,0) rotate(0deg);opacity:.6} 100%{transform:translate(-8px,220px) rotate(360deg);opacity:0} }
      @keyframes fall2 { 0%{transform:translate(0,0) rotate(0deg);opacity:.5} 100%{transform:translate(6px,220px) rotate(-360deg);opacity:0} }
      @keyframes fall3 { 0%{transform:translate(0,0) rotate(0deg);opacity:.6} 100%{transform:translate(-4px,220px) rotate(300deg);opacity:0} }
      @keyframes fall4 { 0%{transform:translate(0,0) rotate(0deg);opacity:.4} 100%{transform:translate(10px,220px) rotate(420deg);opacity:0} }
      @keyframes fall5 { 0%{transform:translate(0,0) rotate(0deg);opacity:.5} 100%{transform:translate(-6px,220px) rotate(-300deg);opacity:0} }

      /* Grid pan */
      .grid-pan {
        animation: gridpan 10s linear infinite;
      }
      @keyframes gridpan {
        0%   { transform: translate(0,0); }
        100% { transform: translate(32px,32px); }
      }
    </style>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7e69ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7e69ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d9e75" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1d9e75" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="680" height="200" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="680" height="200" class="hero-bg"/>

  <!-- Animated grid -->
  <g clip-path="url(#clip)" class="grid-pan">
    <line x1="0" y1="32" x2="720" y2="32" class="grid-line-h"/>
    <line x1="0" y1="64" x2="720" y2="64" class="grid-line-h"/>
    <line x1="0" y1="96" x2="720" y2="96" class="grid-line-h"/>
    <line x1="0" y1="128" x2="720" y2="128" class="grid-line-h"/>
    <line x1="0" y1="160" x2="720" y2="160" class="grid-line-h"/>
    <line x1="0" y1="192" x2="720" y2="192" class="grid-line-h"/>
    <line x1="32"  y1="0" x2="32"  y2="232" class="grid-line-v"/>
    <line x1="64"  y1="0" x2="64"  y2="232" class="grid-line-v"/>
    <line x1="96"  y1="0" x2="96"  y2="232" class="grid-line-v"/>
    <line x1="128" y1="0" x2="128" y2="232" class="grid-line-v"/>
    <line x1="160" y1="0" x2="160" y2="232" class="grid-line-v"/>
    <line x1="192" y1="0" x2="192" y2="232" class="grid-line-v"/>
    <line x1="224" y1="0" x2="224" y2="232" class="grid-line-v"/>
    <line x1="256" y1="0" x2="256" y2="232" class="grid-line-v"/>
    <line x1="288" y1="0" x2="288" y2="232" class="grid-line-v"/>
    <line x1="320" y1="0" x2="320" y2="232" class="grid-line-v"/>
    <line x1="352" y1="0" x2="352" y2="232" class="grid-line-v"/>
    <line x1="384" y1="0" x2="384" y2="232" class="grid-line-v"/>
    <line x1="416" y1="0" x2="416" y2="232" class="grid-line-v"/>
    <line x1="448" y1="0" x2="448" y2="232" class="grid-line-v"/>
    <line x1="480" y1="0" x2="480" y2="232" class="grid-line-v"/>
    <line x1="512" y1="0" x2="512" y2="232" class="grid-line-v"/>
    <line x1="544" y1="0" x2="544" y2="232" class="grid-line-v"/>
    <line x1="576" y1="0" x2="576" y2="232" class="grid-line-v"/>
    <line x1="608" y1="0" x2="608" y2="232" class="grid-line-v"/>
    <line x1="640" y1="0" x2="640" y2="232" class="grid-line-v"/>
    <line x1="672" y1="0" x2="672" y2="232" class="grid-line-v"/>
  </g>

  <!-- Glow orbs -->
  <ellipse cx="0" cy="30" rx="150" ry="150" fill="url(#glowA)" class="glow1"/>
  <ellipse cx="640" cy="170" rx="130" ry="130" fill="url(#glowB)" class="glow2"/>

  <!-- Falling petals -->
  <g clip-path="url(#clip)">
    <rect class="p1" x="580" y="0"  width="6" height="6" rx="3" fill="#b980e0" opacity="0.6"/>
    <rect class="p2" x="600" y="0"  width="5" height="5" rx="2.5" fill="#7e69ff" opacity="0.5"/>
    <rect class="p3" x="620" y="0"  width="6" height="6" rx="3" fill="#1d9e75" opacity="0.6"/>
    <rect class="p4" x="560" y="0"  width="4" height="4" rx="2" fill="#b980e0" opacity="0.4"/>
    <rect class="p5" x="640" y="0"  width="6" height="6" rx="3" fill="#7e69ff" opacity="0.5"/>
  </g>

  <!-- Text content -->
  <text x="40" y="76" class="tag-text">// AI · ML · Data Science</text>

  <text x="40" y="120" class="name-text">hi, i'm <tspan class="name-accent">Aathira</tspan> 👋</text>

  <text x="40" y="152" class="sub-text">building intelligent systems, one dataset at a time</text>
  <rect x="424" y="138" width="2" height="16" rx="1" class="cursor"/>

  <text x="40" y="178" class="sub-text" opacity="0.6">Python  ·  ML Engineering  ·  RAG  ·  LLMs</text>
</svg>
