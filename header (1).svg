<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }

      @keyframes petal1 { 0%{transform:translate(0,0) rotate(0deg);opacity:.7} 100%{transform:translate(-14px,210px) rotate(420deg);opacity:0} }
      @keyframes petal2 { 0%{transform:translate(0,0) rotate(0deg);opacity:.5} 100%{transform:translate(9px,210px) rotate(-380deg);opacity:0} }
      @keyframes petal3 { 0%{transform:translate(0,0) rotate(0deg);opacity:.6} 100%{transform:translate(-7px,210px) rotate(310deg);opacity:0} }
      @keyframes petal4 { 0%{transform:translate(0,0) rotate(0deg);opacity:.4} 100%{transform:translate(11px,210px) rotate(440deg);opacity:0} }
      @keyframes petal5 { 0%{transform:translate(0,0) rotate(0deg);opacity:.6} 100%{transform:translate(-5px,210px) rotate(-290deg);opacity:0} }
      @keyframes petal6 { 0%{transform:translate(0,0) rotate(0deg);opacity:.5} 100%{transform:translate(8px,210px) rotate(360deg);opacity:0} }
      @keyframes petal7 { 0%{transform:translate(0,0) rotate(0deg);opacity:.4} 100%{transform:translate(-10px,210px) rotate(-410deg);opacity:0} }
      @keyframes petal8 { 0%{transform:translate(0,0) rotate(0deg);opacity:.6} 100%{transform:translate(6px,210px) rotate(330deg);opacity:0} }

      .sp1 { animation: petal1 5.0s linear 0.0s infinite; }
      .sp2 { animation: petal2 6.2s linear 1.1s infinite; }
      .sp3 { animation: petal3 4.5s linear 2.2s infinite; }
      .sp4 { animation: petal4 5.8s linear 0.6s infinite; }
      .sp5 { animation: petal5 7.0s linear 1.8s infinite; }
      .sp6 { animation: petal6 4.8s linear 2.8s infinite; }
      .sp7 { animation: petal7 6.5s linear 0.3s infinite; }
      .sp8 { animation: petal8 5.3s linear 3.2s infinite; }

      @keyframes rain1 { 0%{transform:translateY(-100%);opacity:0} 8%{opacity:.55} 85%{opacity:.45} 100%{transform:translateY(210px);opacity:0} }
      @keyframes rain2 { 0%{transform:translateY(-100%);opacity:0} 12%{opacity:.45} 80%{opacity:.38} 100%{transform:translateY(210px);opacity:0} }
      @keyframes rain3 { 0%{transform:translateY(-100%);opacity:0} 6%{opacity:.5} 88%{opacity:.42} 100%{transform:translateY(210px);opacity:0} }

      .rc1 { animation: rain1 3.2s linear 0.0s infinite; }
      .rc2 { animation: rain2 4.1s linear 0.8s infinite; }
      .rc3 { animation: rain3 3.7s linear 1.5s infinite; }
      .rc4 { animation: rain1 2.9s linear 0.4s infinite; }
      .rc5 { animation: rain2 4.5s linear 2.1s infinite; }
      .rc6 { animation: rain3 3.4s linear 1.0s infinite; }
      .rc7 { animation: rain1 5.0s linear 1.7s infinite; }
      .rc8 { animation: rain2 3.8s linear 2.6s infinite; }

      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; }

      @keyframes tagfade { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:translateX(0)} }
      .tag-in { animation: tagfade 0.7s ease 0.2s both; }
      @keyframes namefade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      .name-in { animation: namefade 0.8s ease 0.4s both; }
      .sub-in  { animation: namefade 0.8s ease 0.6s both; }
      .pills-in{ animation: namefade 0.8s ease 0.8s both; }

      @keyframes glowpulse { 0%,100%{opacity:.18} 50%{opacity:.32} }
      .glow1 { animation: glowpulse 4s ease-in-out infinite; }
      .glow2 { animation: glowpulse 4s ease-in-out 2s infinite; }
    </style>

    <radialGradient id="gA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c57bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c57bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879a0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e879a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6eff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c6eff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="680" height="200"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="680" height="200" fill="#0d0f1a"/>

  <!-- Subtle horizontal lines -->
  <line x1="0" y1="50"  x2="680" y2="50"  stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
  <line x1="0" y1="100" x2="680" y2="100" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
  <line x1="0" y1="150" x2="680" y2="150" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>

  <!-- Glow orbs -->
  <ellipse cx="60"  cy="50"  rx="180" ry="180" fill="url(#gA)" class="glow1"/>
  <ellipse cx="580" cy="170" rx="150" ry="150" fill="url(#gB)" class="glow2"/>
  <ellipse cx="340" cy="100" rx="200" ry="100" fill="url(#gC)" class="glow1"/>

  <!-- Code rain columns (right half) -->
  <g clip-path="url(#clip)">
    <text class="mono rc1" x="422" y="0"  font-size="11" fill="#c57bff" opacity="0.5" writing-mode="tb">AI10ML01</text>
    <text class="mono rc2" x="444" y="0"  font-size="11" fill="#e879a0" opacity="0.4" writing-mode="tb">データ科学</text>
    <text class="mono rc3" x="466" y="0"  font-size="11" fill="#7c6eff" opacity="0.5" writing-mode="tb">10RAG01</text>
    <text class="mono rc4" x="488" y="0"  font-size="11" fill="#c57bff" opacity="0.4" writing-mode="tb">LLMVEC10</text>
    <text class="mono rc5" x="510" y="0"  font-size="11" fill="#e879a0" opacity="0.45" writing-mode="tb">01100111</text>
    <text class="mono rc6" x="532" y="0"  font-size="11" fill="#7c6eff" opacity="0.4" writing-mode="tb">モデル学習</text>
    <text class="mono rc7" x="554" y="0"  font-size="11" fill="#c57bff" opacity="0.5" writing-mode="tb">PYTHON3</text>
    <text class="mono rc8" x="576" y="0"  font-size="11" fill="#e879a0" opacity="0.38" writing-mode="tb">11001RAG</text>

    <!-- Petals scattered across right area -->
    <rect class="sp1" x="460" y="-8"  width="7" height="7" rx="3.5" fill="#e879a0"/>
    <rect class="sp2" x="500" y="-8"  width="5" height="5" rx="2.5" fill="#c57bff"/>
    <rect class="sp3" x="530" y="-8"  width="6" height="6" rx="3"   fill="#e879a0"/>
    <rect class="sp4" x="440" y="-8"  width="4" height="4" rx="2"   fill="#9d94ff"/>
    <rect class="sp5" x="560" y="-8"  width="7" height="7" rx="3.5" fill="#c57bff"/>
    <rect class="sp6" x="590" y="-8"  width="5" height="5" rx="2.5" fill="#e879a0"/>
    <rect class="sp7" x="615" y="-8"  width="6" height="6" rx="3"   fill="#c57bff"/>
    <rect class="sp8" x="480" y="-8"  width="4" height="4" rx="2"   fill="#e879a0"/>
  </g>

  <!-- Vertical divider line -->
  <line x1="410" y1="20" x2="410" y2="180" stroke="#c57bff" stroke-width="0.4" opacity="0.2" stroke-dasharray="4 6"/>

  <!-- Text content -->
  <text x="40" y="72" class="mono tag-in" font-size="11" fill="#e879a0" letter-spacing="2.5">// AI · ML · Data Science</text>

  <text x="40" y="116" class="sans name-in" font-size="32" font-weight="600" fill="#f0eaff">hi, i&#39;m </text>
  <text x="175" y="116" class="sans name-in" font-size="32" font-weight="600">
    <tspan fill="#c57bff">A</tspan><tspan fill="#cc74f5">a</tspan><tspan fill="#d46ee8">t</tspan><tspan fill="#da6add">h</tspan><tspan fill="#de68d4">i</tspan><tspan fill="#e167c8">r</tspan><tspan fill="#e366bc">a</tspan>
  </text>
  <text x="335" y="116" class="sans name-in" font-size="32" fill="#f0eaff"> 👋</text>

  <text x="40" y="145" class="mono sub-in" font-size="12" fill="#7a6e9e">building intelligent systems, one dataset at a time</text>
  <rect x="379" y="131" width="2" height="15" rx="1" fill="#c57bff" class="cursor sub-in"/>

  <!-- Pill tags -->
  <g class="pills-in">
    <rect x="40"  y="158" width="46" height="20" rx="10" fill="#1e0d2e" stroke="#c57bff" stroke-width="0.5" opacity="0.9"/>
    <text x="63"  y="172" class="mono" font-size="10" fill="#c57bff" text-anchor="middle">RAG</text>

    <rect x="92"  y="158" width="46" height="20" rx="10" fill="#1e0d2e" stroke="#e879a0" stroke-width="0.5" opacity="0.9"/>
    <text x="115" y="172" class="mono" font-size="10" fill="#e879a0" text-anchor="middle">LLMs</text>

    <rect x="144" y="158" width="72" height="20" rx="10" fill="#1e0d2e" stroke="#7c6eff" stroke-width="0.5" opacity="0.9"/>
    <text x="180" y="172" class="mono" font-size="10" fill="#9d94ff" text-anchor="middle">Vector DBs</text>

    <rect x="222" y="158" width="60" height="20" rx="10" fill="#1e0d2e" stroke="#c57bff" stroke-width="0.5" opacity="0.9"/>
    <text x="252" y="172" class="mono" font-size="10" fill="#c57bff" text-anchor="middle">Python</text>
  </g>

  <!-- Corner watermark -->
  <text x="640" y="188" class="mono" font-size="9" fill="#c57bff" opacity="0.25" text-anchor="end">its-aathira</text>
</svg>
